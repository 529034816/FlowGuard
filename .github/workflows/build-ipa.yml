name: Build FlowGuard IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show build environment
        run: |
          xcodebuild -version
          swift --version

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project FlowGuard.xcodeproj \
            -scheme FlowGuard \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Install ldid
        run: brew install ldid

      - name: Package IPA and pseudo-sign with entitlements
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::未找到 .app 构建产物"
            exit 1
          fi
          echo "打包产物：$APP_PATH"
          rm -rf Payload
          mkdir Payload
          cp -r "$APP_PATH" Payload/

          # 用 ldid 给主 App 与 Widget 注入 entitlements 并伪签名，
          # 这样 AltStore 能从二进制读到 App Group 并完成注册。
          APP_EXE=$(/usr/libexec/PlistBuddy -c "Print CFBundleExecutable" "Payload/FlowGuard.app/Info.plist")
          ldid -SFlowGuard/FlowGuard.entitlements "Payload/FlowGuard.app/$APP_EXE"

          WIDGET_APPEX=$(find "Payload/FlowGuard.app/PlugIns" -name "*.appex" | head -n 1)
          if [ -n "$WIDGET_APPEX" ]; then
            WIDGET_EXE=$(/usr/libexec/PlistBuddy -c "Print CFBundleExecutable" "$WIDGET_APPEX/Info.plist")
            ldid -SWidget/FlowGuardWidget.entitlements "$WIDGET_APPEX/$WIDGET_EXE"
          fi

          echo "== 主 App entitlements =="
          ldid -e "Payload/FlowGuard.app/$APP_EXE" | grep -A3 "application-groups" || echo "主 App 未注入 app group"
          if [ -n "$WIDGET_APPEX" ]; then
            echo "== Widget entitlements =="
            ldid -e "$WIDGET_APPEX/$WIDGET_EXE" | grep -A3 "application-groups" || echo "Widget 未注入 app group"
          fi

          rm -f FlowGuard-unsigned.ipa
          zip -rqy FlowGuard-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowGuard-unsigned-ipa
          path: FlowGuard-unsigned.ipa
          retention-days: 90
