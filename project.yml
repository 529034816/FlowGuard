name: FlowGuard
options:
  bundleIdPrefix: com.flowguard
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "13"
    DEVELOPMENT_LANGUAGE: zh-Hans
targets:
  FlowGuard:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: FlowGuard
      - path: Shared
    info:
      path: FlowGuard/Info.plist
      properties:
        CFBundleDisplayName: 流量管家
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.flowguard.traffic.refresh
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: FlowGuard/FlowGuard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.flowguard.shared
    dependencies:
      - target: FlowGuardWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowguard.traffic
        PRODUCT_NAME: FlowGuard
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        GCC_C_LANGUAGE_STANDARD: gnu17

  FlowGuardWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: FlowGuard Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/FlowGuardWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.flowguard.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowguard.traffic.widget
        PRODUCT_NAME: FlowGuardWidget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
